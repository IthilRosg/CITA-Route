name: Publish stable release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching product.json, for example v0.3.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: false
      - name: Validate release version
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $product=Get-Content product.json -Raw | ConvertFrom-Json
          if($env:RELEASE_TAG -cne ('v'+$product.version)){throw 'Tag must match product.json'}
          if((Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText -ne $product.version){throw 'Assembly version differs'}
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if($LASTEXITCODE -ne 0){throw 'A stable release must come from main'}
      - name: Dependencies and tests
        shell: powershell
        run: |
          ./Bootstrap.ps1
          $env:CITA_WFP_LAB='1'
          & ./runtime/cita-wfp-tests.exe '-test.run=^TestCitaWfpLifecycle$' '-test.timeout=20s'
          if($LASTEXITCODE -ne 0){throw 'Native DNS filter lifecycle failed'}
          Remove-Item Env:CITA_WFP_LAB
          ./Build-All.ps1
          & ./runtime/cita-dns-tests.exe '-test.run=^TestCitaFallback$' '-test.timeout=15s'
          if($LASTEXITCODE -ne 0){throw 'Native DNS fallback failed'}
          & ./runtime/agent-build/RoutePilot.Agent.exe --dns-integration $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'DNS engine integration failed'}
          & ./runtime/agent-build/RoutePilot.Agent.exe --optimization-integration $PWD.Path fast-tcp
          if($LASTEXITCODE -ne 0){throw 'Opt-in TCP integration failed'}
          ./Verify-Portable.ps1
          ./Verify-DesktopRuntime.ps1
          ./Verify-ReleaseUpdate.ps1
          ./Verify-ReleaseUpdate.ps1 -FrameworkDependent
          ./Verify-ReleaseUpdate.ps1 -InstallerSource tests/fixtures/Install-Release-0.5.4.ps1
          ./Verify-Prepare.ps1
          ./Verify-AgentPackage.ps1
          ./Verify-OptimizationGate.ps1
          ./Verify-ConnectionHandoff.ps1
          ./Verify-InstallationGuard.ps1
          ./Verify-InstallationTransaction.ps1
          ./Verify-Storage.ps1
          ./Verify-Lifecycle.ps1
          ./Verify-WireSockRecovery.ps1
          ./Verify-ProfileSync.ps1
          ./Verify-ComponentLiveness.ps1
          ./Verify-ComponentRecovery.ps1 -Engine
          & ./runtime/agent-build/RoutePilot.Agent.exe --component-soak $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'Connection lifecycle soak failed.'}
          ./Verify-Optimization.ps1
          & ./runtime/agent-build/RoutePilot.Agent.exe --resource-integration $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'Resource guard integration failed.'}
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          ./Verify-Startup.ps1
          dotnet build tools/udp-reflector/Cita.UdpReflector.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'UDP reflector build failed.'}
          dotnet build tools/tun-probe/Cita.TunProbe.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Native TUN acceptance client build failed.'}
          & ./runtime/agent-build/RoutePilot.Agent.exe --udp-integration $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'UDP engine integration failed.'}
          ./Build-Portable.ps1
      - name: Verify final archive
        shell: powershell
        run: |
          $zip=Get-ChildItem dist/CITA-Route-*-win-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath runtime/package-check
          $package=Get-ChildItem runtime/package-check -Directory | Select-Object -First 1
          ./Verify-Portable.ps1 -PackageDirectory $package.FullName
          ./Build-Portable.ps1 -FrameworkDependent
          $thin=Get-ChildItem dist/CITA-Route-*-win-x64-framework.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $thin.FullName -DestinationPath runtime/framework-check
          $framework=Get-ChildItem runtime/framework-check -Directory | Select-Object -First 1
          ./Verify-Portable.ps1 -PackageDirectory $framework.FullName -AllowFrameworkDependent
          ./Build-Installer.ps1 -PackageDirectory $framework.FullName
          ./Build-Installer.ps1 -PackageDirectory $framework.FullName -TestBuild
          ./Verify-Installer.ps1 -Setup (Get-ChildItem dist/*-test-setup.exe).FullName
      - name: Create release and upload verified artifacts
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/CITA-Route-*-win-x64*.zip dist/CITA-Route-*-win-x64-setup.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "CITA Route $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
