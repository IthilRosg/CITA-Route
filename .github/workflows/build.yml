name: Build and test Windows client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Additional mixed TCP/UDP loopback soak, 0 or 1-15 minutes
        required: false
        default: '0'
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: false
      - name: Fetch verified engine and public rule data
        shell: powershell
        run: ./Bootstrap.ps1
      - name: Build and run agent tests
        shell: powershell
        run: |
          ./Build-All.ps1
          node ./tools/test-browser-extension.cjs
          if($LASTEXITCODE -ne 0){throw 'Browser extension regression tests failed'}
      - name: Verify native DNS filter boundaries on isolated runner
        shell: powershell
        run: |
          $env:CITA_WFP_LAB='1'
          & ./runtime/cita-wfp-tests.exe '-test.run=^TestCitaWfpLifecycle$' '-test.timeout=20s'
          if($LASTEXITCODE -ne 0){throw 'Native DNS filter lifecycle failed'}
      - name: Verify route-specific DNS fallback and experimental TCP configuration
        shell: powershell
        run: |
          & ./runtime/cita-dns-tests.exe '-test.run=^TestCitaFallback$' '-test.timeout=15s'
          if($LASTEXITCODE -ne 0){throw 'Native DNS fallback failed'}
          & ./runtime/agent-build/RoutePilot.Agent.exe --dns-integration $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'DNS engine integration failed'}
          & ./runtime/agent-build/RoutePilot.Agent.exe --optimization-integration $PWD.Path fast-tcp
          if($LASTEXITCODE -ne 0){throw 'Opt-in TCP integration failed'}
      - name: Offline and loopback checks
        shell: powershell
        run: |
          ./Verify-Portable.ps1
          ./Verify-DesktopRuntime.ps1
          ./Verify-ReleaseUpdate.ps1
          ./Verify-ReleaseUpdate.ps1 -FrameworkDependent
          ./Verify-ReleaseUpdate.ps1 -InstallerSource tests/fixtures/Install-Release-0.5.4.ps1 -Legacy
          ./Verify-Prepare.ps1
          ./Verify-ConnectionHandoff.ps1
          ./Verify-InstallationGuard.ps1
          ./Verify-InstallationTransaction.ps1
          ./Verify-Lifecycle.ps1
          ./Verify-Storage.ps1
          ./Verify-ProfileSync.ps1
          ./Verify-RuleFeeds.ps1
          ./Verify-AgentPackage.ps1
          ./Verify-OptimizationGate.ps1
          ./Verify-WireSockRecovery.ps1
          ./Verify-SessionRecovery.ps1
          ./Verify-ComponentLiveness.ps1
          ./Verify-ComponentRecovery.ps1 -Engine
          & ./runtime/agent-build/RoutePilot.Agent.exe --component-soak $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'Connection lifecycle soak failed.'}
          ./Verify-Optimization.ps1
          & ./runtime/agent-build/RoutePilot.Agent.exe --resource-integration $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'Resource guard integration failed.'}
      - name: Verify startup service in SYSTEM session 0 with synthetic transport
        shell: powershell
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: |
          if($env:SOAK_MINUTES -and $env:SOAK_MINUTES -ne '0'){./Verify-Startup.ps1 -ReadinessDelaySeconds 185}else{./Verify-Startup.ps1}
      - name: Extended simultaneous TCP and UDP recovery soak
        if: github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0'
        shell: powershell
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: |
          $minutes=0
          if(-not [int]::TryParse($env:SOAK_MINUTES,[ref]$minutes) -or $minutes -lt 1 -or $minutes -gt 15){throw 'Soak duration must be 1-15 minutes.'}
          & ./runtime/agent-build/RoutePilot.Agent.exe --mixed-soak $PWD.Path ($minutes*60)
          if($LASTEXITCODE -ne 0){throw 'Extended mixed recovery soak failed.'}
      - name: Build acceptance tools
        shell: powershell
        run: |
          dotnet build tools/udp-reflector/Cita.UdpReflector.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'UDP reflector build failed.'}
          dotnet build tools/tun-probe/Cita.TunProbe.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Native TUN acceptance client build failed.'}
      - name: Verify real SOCKS UDP and authenticated reflector
        shell: powershell
        run: |
          & ./runtime/agent-build/RoutePilot.Agent.exe --udp-integration $PWD.Path
          if($LASTEXITCODE -ne 0){throw 'UDP engine integration failed.'}
      - name: Build self-contained package
        shell: powershell
        run: ./Build-Portable.ps1
      - name: Verify extracted package
        shell: powershell
        run: |
          $zip=Get-ChildItem dist/CITA-Route-*-win-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath runtime/package-check
          $package=Get-ChildItem runtime/package-check -Directory | Select-Object -First 1
          ./Verify-Portable.ps1 -PackageDirectory $package.FullName
          ./Build-Portable.ps1 -FrameworkDependent
          $thin=Get-ChildItem dist/CITA-Route-*-win-x64-framework.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $thin.FullName -DestinationPath runtime/framework-check
          $framework=Get-ChildItem runtime/framework-check -Directory | Select-Object -First 1
          ./Verify-Portable.ps1 -PackageDirectory $framework.FullName -AllowFrameworkDependent
          ./Build-Installer.ps1 -PackageDirectory $framework.FullName
          ./Build-Installer.ps1 -PackageDirectory $framework.FullName -TestBuild
          ./Verify-Installer.ps1 -Setup (Get-ChildItem dist/*-test-setup.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: cita-route-win-x64
          path: |
            dist/CITA-Route-*-win-x64*.zip
            dist/CITA-Route-*-win-x64-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: |
            data/lifecycle-soak.json
            data/mixed-soak.json
            logs/udp-engine-test.json
            logs/optimization-check-last.json
            runtime/optimization-check-*/optimization-integration.log
            runtime/optimization-*/result.json
          if-no-files-found: ignore
